<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jr.</title>
<style>

body{
    background:#111;
    color:#eee;
    font-family:Consolas,monospace;
    max-width:800px;
    margin:auto;
    padding:24px;
}

#chat{
    background:#1c1c1c;
    border-radius:8px;
    padding:14px;
    min-height:360px;
    max-height:60vh;
    overflow-y:auto;
    white-space:pre-wrap;
    line-height:1.5;
}

.user{ color:#7ec8ff; }
.jr{ color:#8fe38f; }

#input-row{
    display:flex;
    gap:8px;
    margin-top:12px;
}

textarea{
    flex:1;
    background:#1c1c1c;
    color:#eee;
    border:none;
    border-radius:6px;
    padding:10px;
    font-family:inherit;
    font-size:15px;
    resize:none;
    height:44px;
}

button{
    padding:0 16px;
    border:none;
    border-radius:6px;
    background:#333;
    color:#eee;
    cursor:pointer;
}

button:hover{ background:#444; }

#top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

#top-row button{ font-size:12px; padding:6px 10px; }

</style>
</head>
<body>

<div id="top-row">
    <h2 style="margin:0;">Jr.</h2>
    <button onclick="changeKey()">Cambiar llave</button>
    <button onclick="resetMemory()">Resetear memoria</button>
</div>

<div id="chat"></div>

<div id="input-row">
    <textarea id="prompt" placeholder="Escribe un mensaje..."></textarea>
    <button onclick="send()">Enviar</button>
</div>

<script>

const endpoint = "https://api.groq.com/openai/v1/chat/completions";
const chat = document.getElementById("chat");
const promptBox = document.getElementById("prompt");

let apiKey = localStorage.getItem("jr_key");
let history = JSON.parse(localStorage.getItem("jr_history") || "[]");
let memory = JSON.parse(localStorage.getItem("jr_memory") || '{"facts":{},"likes":[]}');

if(!apiKey){
    apiKey = prompt("Ingresa tu Groq API Key:");
    if(apiKey) localStorage.setItem("jr_key", apiKey);
}

function changeKey(){
    const key = prompt("Nueva Groq API Key:");
    if(key){
        apiKey = key;
        localStorage.setItem("jr_key", key);
    }
}

function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function resetMemory(){
    if(confirm("¿Borrar toda la memoria y el historial del chat? Esta acción no se puede deshacer.")){
        memory = { facts:{}, likes:[] };
        history = [];
        localStorage.setItem("jr_memory", JSON.stringify(memory));
        localStorage.setItem("jr_history", JSON.stringify(history));
        chat.innerHTML = "";
        alert("Memoria y chat borrados.");
    }
}

// --- memory extraction (rule-based, no extra API calls) ---
function extractMemory(text){
    const factPatterns = [
        { re:/\b(?:soy|me llamo|mi nombre es)\s+([a-záéíóúñ]{2,20})/i, key:"nombre" },
        { re:/\b(?:my name is|i'?m|i am)\s+([a-z]{2,20})\b/i, key:"nombre" },
        { re:/\btengo\s+(\d{1,3})\s*años/i, key:"edad" },
        { re:/\bvivo en\s+([a-záéíóúñ\s]{2,30}?)(?:[.,!]|$)/i, key:"ubicación" },
        { re:/\btrabajo (?:en|como)\s+([a-záéíóúñ\s]{2,40}?)(?:[.,!]|$)/i, key:"trabajo" }
    ];
    const likePatterns = [
        /\bme gusta\s+(.+?)(?:[.,!]|$)/i,
        /\bi like\s+(.+?)(?:[.,!]|$)/i
    ];

    const stopwords = ["tu","tú","yo","el","él","la","que","aqui","aquí","alli","allí",
        "the","you","not","sure","fine","good","ok","okay","here","there","this","that"];

    let changed = false;

    for(const p of factPatterns){
        // "nombre" is locked once set — only resetMemory() can change it
        if(p.key === "nombre" && memory.facts.nombre) continue;

        const m = text.match(p.re);
        if(m){
            const raw = m[1].trim();
            if(stopwords.includes(raw.toLowerCase())) continue;
            const val = capitalize(raw);
            if(memory.facts[p.key] !== val){
                memory.facts[p.key] = val;
                changed = true;
            }
        }
    }
    for(const re of likePatterns){
        const m = text.match(re);
        if(m){
            const val = m[1].trim();
            if(val.length < 60 && !stopwords.includes(val.toLowerCase()) && !memory.likes.includes(val)){
                memory.likes.push(val);
                changed = true;
            }
        }
    }

    if(changed) localStorage.setItem("jr_memory", JSON.stringify(memory));
}

function memoryBlock(){
    const lines = [];
    for(const [k,v] of Object.entries(memory.facts)) lines.push(`${k}: ${v}`);
    if(memory.likes.length) lines.push(`le gusta: ${memory.likes.join(", ")}`);
    return lines.length ? "Datos conocidos del usuario:\n" + lines.join("\n") : "";
}

// --- date & time ---
function getDateTimeString(){
    const now = new Date();
    const days = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
    const months = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    const hour = now.getHours().toString().padStart(2,"0");
    const minute = now.getMinutes().toString().padStart(2,"0");
    return `Fecha y hora actual: ${days[now.getDay()]}, ${now.getDate()} de ${months[now.getMonth()]} de ${now.getFullYear()}, ${hour}:${minute}.`;
}

// --- weather (Open-Meteo, no API key needed) ---
const weatherCodes = {
    0:"despejado", 1:"mayormente despejado", 2:"parcialmente nublado", 3:"nublado",
    45:"con niebla", 48:"con niebla helada",
    51:"con llovizna ligera", 53:"con llovizna", 55:"con llovizna densa",
    61:"con lluvia ligera", 63:"con lluvia", 65:"con lluvia fuerte",
    71:"con nieve ligera", 73:"con nieve", 75:"con nieve fuerte",
    80:"con chubascos", 81:"con chubascos fuertes", 82:"con chubascos muy fuertes",
    95:"con tormenta eléctrica", 96:"con tormenta y granizo", 99:"con tormenta fuerte y granizo"
};

async function getWeatherInfo(place){
    try{
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(place)}&count=1&language=es&format=json`);
        const geoData = await geoRes.json();
        if(!geoData.results || !geoData.results.length) return null;

        const { latitude, longitude, name, country } = geoData.results[0];
        const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code&timezone=auto`);
        const wData = await wRes.json();
        const c = wData.current;
        const desc = weatherCodes[c.weather_code] || "condición variable";

        return `Clima actual en ${name}, ${country}: ${c.temperature_2m}°C, sensación térmica de ${c.apparent_temperature}°C, humedad ${c.relative_humidity_2m}%, cielo ${desc}.`;
    }catch(e){
        return null;
    }
}

// --- tool definitions handed to the model; Groq decides when to call them ---
const tools = [
    {
        type:"function",
        function:{
            name:"search_wikipedia",
            description:"Busca un resumen actualizado en Wikipedia en español. Úsalo para personas, cargos, lugares, o cualquier dato que pueda haber cambiado (ej. quién ocupa un cargo actualmente, capitales, población).",
            parameters:{
                type:"object",
                properties:{
                    query:{ type:"string", description:"Término a buscar, ej. 'Presidente de México' o 'Claudia Sheinbaum'" }
                },
                required:["query"]
            }
        }
    },
    {
        type:"function",
        function:{
            name:"get_weather",
            description:"Obtiene el clima actual de un lugar: temperatura, sensación térmica, humedad y condición del cielo.",
            parameters:{
                type:"object",
                properties:{
                    place:{ type:"string", description:"Nombre del lugar o ciudad, ej. 'Querétaro'" }
                },
                required:["place"]
            }
        }
    }
];

async function runTool(name, args){
    if(name === "search_wikipedia"){
        return await getWikipediaSummary(args.query) || "No se encontró esa página en Wikipedia.";
    }
    if(name === "get_weather"){
        return await getWeatherInfo(args.place) || "No se pudo obtener el clima de ese lugar.";
    }
    return "Herramienta desconocida.";
}

// --- wikipedia lookup ---
async function getWikipediaSummary(query){
    try{
        // try the query as a direct page title first
        let res = await fetch(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
        if(res.ok){
            const data = await res.json();
            if(data.extract) return `Resumen de Wikipedia sobre ${data.title}: ${data.extract}`;
        }

        // fallback: search wikipedia for the closest matching article title
        const searchRes = await fetch(`https://es.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=1&namespace=0&format=json&origin=*`);
        const searchData = await searchRes.json();
        const title = searchData[1] && searchData[1][0];
        if(!title) return null;

        res = await fetch(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
        if(!res.ok) return null;
        const data = await res.json();
        return data.extract ? `Resumen de Wikipedia sobre ${data.title}: ${data.extract}` : null;
    }catch(e){
        return null;
    }
}

function addMessage(type, text){
    chat.innerHTML += `<div class="${type}"><b>${type=="user"?"Tú":"Jr"}:</b> ${text}</div><br>`;
    chat.scrollTop = chat.scrollHeight;
}

function renderHistory(){
    chat.innerHTML = "";
    for(const m of history){
        addMessage(m.role === "user" ? "user" : "jr", m.content);
    }
}
renderHistory();

async function send(){
    const text = promptBox.value.trim();
    if(text == "") return;

    addMessage("user", text);
    history.push({ role:"user", content:text });
    localStorage.setItem("jr_history", JSON.stringify(history));

    extractMemory(text);

    promptBox.value = "";
    addMessage("jr", "Pensando...");

    const mem = memoryBlock();

    const systemContent = `Eres Jr., un asistente de IA. Lo admites con naturalidad si preguntan; no finges ser humano.
Estilo: directo y útil como Alexa o Google Assistant, respuestas cortas y al grano.
Actitud: alegre, positiva, entusiasta — nunca cortante ni amargado.
Personalidad de fondo (se nota en el tono, no en el largo de tus respuestas): ambicioso y enfocado, creativo, buen amigo confiable, curioso y detallista con lo que te apasiona.
Tienes herramientas (search_wikipedia, get_weather) para datos que puedan haber cambiado: cargos actuales, clima, población. Úsalas cuando aplique y confía en su resultado sin aclarar que tu entrenamiento tiene otra fecha.
Hablas siempre en español, breve.
Tu nombre siempre es Jr.

${getDateTimeString()}` + (mem ? "\n\n" + mem : "");

    // local working copy for this request — tool call/result messages are NOT
    // saved to persistent history, only the final user-visible reply is.
    let apiMessages = [{ role:"system", content:systemContent }, ...history.slice(-8)];

    try{
        let reply = null;
        let useTools = true;

        for(let round = 0; round < 6; round++){
            const response = await fetch(endpoint, {
                method:"POST",
                headers:{
                    "Authorization":"Bearer " + apiKey,
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(useTools ? {
                    model:"openai/gpt-oss-20b",
                    messages:apiMessages,
                    tools:tools,
                    tool_choice:"auto"
                } : {
                    model:"openai/gpt-oss-20b",
                    messages:apiMessages
                })
            });

            const data = await response.json();

            if(data.error){
                // if the model botches a tool call, drop tools and retry plainly
                // instead of leaving the user stuck on "Pensando..."
                if(data.error.code === "tool_use_failed" && useTools){
                    useTools = false;
                    continue;
                }
                throw new Error(data.error.message);
            }

            const msg = data.choices[0].message;

            if(msg.tool_calls && msg.tool_calls.length){
                apiMessages.push(msg);
                for(const tc of msg.tool_calls){
                    let args = {};
                    try{ args = JSON.parse(tc.function.arguments || "{}"); }catch(e){}
                    const result = await runTool(tc.function.name, args);
                    apiMessages.push({ role:"tool", tool_call_id:tc.id, content:result });
                }
                continue; // let the model see the tool results and respond
            }

            reply = msg.content;
            break;
        }

        // if the tool loop never converged, force one plain final answer
        // instead of giving up — using whatever tool results we already have
        if(reply === null){
            try{
                const finalRes = await fetch(endpoint, {
                    method:"POST",
                    headers:{
                        "Authorization":"Bearer " + apiKey,
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({ model:"openai/gpt-oss-20b", messages:apiMessages })
                });
                const finalData = await finalRes.json();
                if(!finalData.error) reply = finalData.choices[0].message.content;
            }catch(e){}
        }

        if(reply === null){
            reply = "No pude completar la respuesta esta vez. ¿Puedes reformular la pregunta?";
        }

        document.querySelectorAll(".jr")[document.querySelectorAll(".jr").length-1].remove();

        // always save the assistant turn — even a failure message — so the
        // next request's history stays in sync (no stacked unanswered turns)
        addMessage("jr", reply);
        history.push({ role:"assistant", content:reply });
        localStorage.setItem("jr_history", JSON.stringify(history));

    }catch(err){
        document.querySelectorAll(".jr")[document.querySelectorAll(".jr").length-1].remove();
        addMessage("jr", err.message);
    }
}

promptBox.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        send();
    }
});

</script>
</body>
</html>
